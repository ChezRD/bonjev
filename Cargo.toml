[package]
name = "bonjev"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BonJev: one-step choice server for Bonsai GGUF on llama.cpp"

[[bin]]
name = "bonjev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
